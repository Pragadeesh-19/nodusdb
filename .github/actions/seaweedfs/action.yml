name: seaweedfs
description: Start SeaweedFS, pinned by digest, with an authenticated S3 gateway on port 8333, and create one bucket

inputs:
  bucket:
    description: The bucket to create once the gateway answers
    required: true

runs:
  using: composite
  steps:
    - name: Start SeaweedFS with an authenticated S3 gateway
      shell: bash
      run: |
        set -eu
        docker run -d --name seaweedfs -p 8333:8333 \
          -v "$GITHUB_WORKSPACE/.github/s3/identities.json:/etc/seaweedfs/s3.json:ro" \
          chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
          server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
        for attempt in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)
          if [ "$code" = "200" ] || [ "$code" = "403" ]; then
            exit 0
          fi
          sleep 2
        done
        docker logs seaweedfs
        exit 1

    - name: Create the bucket
      shell: bash
      run: aws --endpoint-url http://127.0.0.1:8333 s3 mb "s3://${{ inputs.bucket }}"
