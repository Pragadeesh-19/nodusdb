name: ci

on:
  push:
  pull_request:

jobs:
  s3-compatibility:
    name: S3 compatibility (SeaweedFS)
    runs-on: ubuntu-latest
    env:
      NODUS_S3_ENDPOINT: http://127.0.0.1:8333
      NODUS_S3_BUCKET: nodus-test
      NODUS_S3_ACCESS_KEY: nodus
      NODUS_S3_SECRET_KEY: nodus-secret-key
      AWS_ACCESS_KEY_ID: nodus
      AWS_SECRET_ACCESS_KEY: nodus-secret-key
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Start SeaweedFS with an authenticated S3 gateway
        run: |
          set -eu
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/.github/s3/identities.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)
            if [ "$code" = "200" ] || [ "$code" = "403" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs seaweedfs
          exit 1

      - name: Create the test bucket
        run: aws --endpoint-url "$NODUS_S3_ENDPOINT" s3 mb "s3://$NODUS_S3_BUCKET"

      - name: Run the object store contract against the real server
        run: mvn -B -ntp -pl core test -Dtest=RealS3ContractTest

      - name: Show the server log when the tests fail
        if: failure()
        run: docker logs seaweedfs

  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25 (Oracle)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GRAALVM_HOME
        shell: bash
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Configure MSVC for native-image
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python packages that judge the Parquet, Avro and Iceberg output
        run: python -m pip install "pyiceberg[pyarrow]" fastavro pyarrow tzdata

      - name: Java tests
        env:
          NODUS_REQUIRE_PYTHON_VERIFIERS: "1"
        run: mvn -B -ntp test -Dnodus.sim.seeds=300

      - name: Build native shared library
        run: mvn -B -ntp -Pnative -pl core package -DskipTests

      - name: Package native library into the Python package
        shell: bash
        run: |
          set -eu
          tag=$(python -c "import sys; sys.path.insert(0, 'python'); from nodusdb._native import platform_tag; print(platform_tag())")
          destination="python/nodusdb/bin/$tag"
          mkdir -p "$destination"
          case "$RUNNER_OS" in
            Linux) library=libnodusdb.so ;;
            macOS) library=libnodusdb.dylib ;;
            Windows) library=libnodusdb.dll ;;
          esac
          cp "target/native/$library" "$destination/"
          echo "packaged $destination/$library"

      - name: Install Python package
        run: python -m pip install -e python/

      - name: Install Python test dependencies
        run: python -m pip install pytest pyarrow

      - name: Python tests
        env:
          NODUSDB_REQUIRE_PYARROW: "1"
          NODUS_REQUIRE_PYTHON_VERIFIERS: "1"
        run: python -m pytest python/tests -v -ra

      - name: Native performance gate
        run: python python/benchmarks/native_ratio.py

      - name: Shipping overhead gate
        run: python python/benchmarks/shipping_ratio.py

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: nodusdb-native-${{ matrix.os }}
          path: python/nodusdb/bin/
