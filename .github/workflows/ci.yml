name: ci

on:
  push:
  pull_request:

jobs:
  s3-compatibility:
    name: S3 compatibility (SeaweedFS)
    runs-on: ubuntu-latest
    env:
      NODUS_S3_ENDPOINT: http://127.0.0.1:8333
      NODUS_S3_BUCKET: nodus-test
      NODUS_S3_ACCESS_KEY: nodus
      NODUS_S3_SECRET_KEY: nodus-secret-key
      AWS_ACCESS_KEY_ID: nodus
      AWS_SECRET_ACCESS_KEY: nodus-secret-key
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Start SeaweedFS and create the test bucket
        uses: ./.github/actions/seaweedfs
        with:
          bucket: ${{ env.NODUS_S3_BUCKET }}

      - name: Run the object store contract and the chaos scenarios against the real server
        run: mvn -B -ntp -pl core test -Dtest="RealS3ContractTest,S3ChaosTest"

      - name: Show the server log when the tests fail
        if: failure()
        run: docker logs seaweedfs

  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25 (Oracle) for the Java tests
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python packages that judge the Parquet, Avro and Iceberg output
        run: python -m pip install "pyiceberg[pyarrow]" fastavro pyarrow tzdata

      - name: Java tests
        env:
          NODUS_REQUIRE_PYTHON_VERIFIERS: "1"
        run: mvn -B -ntp test "-Dnodus.sim.seeds=300"

      - name: Set up the native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Build native shared library
        run: mvn -B -ntp -Pnative -pl core package -DskipTests

      - name: Package native library into the Python package
        shell: bash
        run: |
          set -eu
          tag=$(python -c "import sys; sys.path.insert(0, 'python'); from nodusdb._native import platform_tag; print(platform_tag())")
          destination="python/nodusdb/bin/$tag"
          mkdir -p "$destination"
          case "$RUNNER_OS" in
            Linux) library=libnodusdb.so ;;
            macOS) library=libnodusdb.dylib ;;
            Windows) library=libnodusdb.dll ;;
          esac
          cp "target/native/$library" "$destination/"
          echo "packaged $destination/$library"

      - name: Install Python package
        run: python -m pip install -e python/

      - name: Install Python test dependencies
        run: python -m pip install pytest pyarrow -r python/benchmarks/act2/requirements.txt

      - name: Python tests
        env:
          NODUSDB_REQUIRE_PYARROW: "1"
          NODUS_REQUIRE_PYTHON_VERIFIERS: "1"
        run: python -m pytest python/tests -v -ra

      - name: Native performance gate
        run: python python/benchmarks/native_ratio.py

      - name: Shipping overhead gate
        run: python python/benchmarks/shipping_ratio.py

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: nodusdb-native-${{ matrix.os }}
          path: python/nodusdb/bin/

  act2:
    name: Act 2 on SeaweedFS
    needs: build
    runs-on: ubuntu-latest
    env:
      NODUS_S3_ENDPOINT: http://127.0.0.1:8333
      NODUS_S3_BUCKET: nodus-act2
      AWS_ACCESS_KEY_ID: nodus
      AWS_SECRET_ACCESS_KEY: nodus-secret-key
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Start SeaweedFS and create the bucket
        uses: ./.github/actions/seaweedfs
        with:
          bucket: ${{ env.NODUS_S3_BUCKET }}

      - name: Take the native library the build job made
        uses: actions/download-artifact@v4
        with:
          name: nodusdb-native-ubuntu-latest
          path: python/nodusdb/bin/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the readers Act 2 judges the lake with
        run: python -m pip install -r python/benchmarks/act2/requirements.txt

      - name: Run Act 2 at the default commit interval
        working-directory: python/benchmarks
        run: python -m act2 --endpoint "$NODUS_S3_ENDPOINT" --path-style --bucket "$NODUS_S3_BUCKET" --out "$RUNNER_TEMP/act2.json"

      - name: Keep the results document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act2-results
          path: ${{ runner.temp }}/act2.json
          if-no-files-found: ignore

      - name: Show the server log when the run fails
        if: failure()
        run: docker logs seaweedfs
