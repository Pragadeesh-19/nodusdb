name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM CE 22
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "22.0.2"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GRAALVM_HOME
        shell: bash
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Configure MSVC for native-image
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java tests
        run: mvn -B -ntp test

      - name: Build native shared library
        run: mvn -B -ntp -Pnative -pl core package -DskipTests

      - name: Package native library into the Python package
        shell: bash
        run: |
          set -eu
          tag=$(python -c "import sys; sys.path.insert(0, 'python'); from nodusdb._native import platform_tag; print(platform_tag())")
          destination="python/nodusdb/bin/$tag"
          mkdir -p "$destination"
          case "$RUNNER_OS" in
            Linux) library=libnodusdb.so ;;
            macOS) library=libnodusdb.dylib ;;
            Windows) library=libnodusdb.dll ;;
          esac
          cp "target/native/$library" "$destination/"
          echo "packaged $destination/$library"

      - name: Install Python package
        run: python -m pip install -e python/

      - name: Python tests
        run: python -m unittest discover -s python/tests -v

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: nodusdb-native-${{ matrix.os }}
          path: python/nodusdb/bin/
