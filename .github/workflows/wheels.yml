name: wheels

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native library (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            tag: linux-x86_64
          - runner: ubuntu-22.04-arm
            tag: linux-arm64
          - runner: macos-15-intel
            tag: macos-x86_64
            graalvm: "25.0.1"
          - runner: macos-14
            tag: macos-arm64
          - runner: windows-2022
            tag: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up the native toolchain
        uses: ./.github/actions/native-toolchain
        with:
          java-version: ${{ matrix.graalvm }}

      - name: Build native shared library
        run: mvn -B -ntp -Pnative -pl core package -DskipTests

      - name: Stage native library under its platform tag
        shell: bash
        run: |
          set -eu
          destination="python/nodusdb/bin/${{ matrix.tag }}"
          mkdir -p "$destination"
          case "$RUNNER_OS" in
            Linux) library=libnodusdb.so ;;
            macOS) library=libnodusdb.dylib ;;
            Windows) library=libnodusdb.dll ;;
          esac
          cp "target/native/$library" "$destination/"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: python/nodusdb/bin/${{ matrix.tag }}
          if-no-files-found: error

  wheels:
    name: wheels (${{ matrix.tag }})
    needs: native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            tag: linux-x86_64
            archs: x86_64
            wheel_platform: manylinux_2_34_x86_64
            test_skip: "*-manylinux*"
          - runner: ubuntu-22.04-arm
            tag: linux-arm64
            archs: aarch64
            wheel_platform: manylinux_2_34_aarch64
            test_skip: "*-manylinux*"
          - runner: macos-15-intel
            tag: macos-x86_64
            archs: x86_64
            wheel_platform: macosx_11_0_x86_64
            test_skip: ""
          - runner: macos-14
            tag: macos-arm64
            archs: arm64
            wheel_platform: macosx_11_0_arm64
            test_skip: ""
          - runner: windows-2022
            tag: windows-x86_64
            archs: AMD64
            wheel_platform: win_amd64
            test_skip: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore native library
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: python/nodusdb/bin/${{ matrix.tag }}

      - name: Stage the license files into the package
        run: python scripts/stage_package_files.py

      - name: Build and test the wheel
        uses: pypa/cibuildwheel@v2.23.4
        with:
          package-dir: python
          output-dir: dist
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32 pp*"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_TEST_COMMAND: "python {package}/tests/wheel_smoke.py"
          CIBW_TEST_SKIP: ${{ matrix.test_skip }}
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --plat ${{ matrix.wheel_platform }} -w {dest_dir} {wheel}"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

      - name: Check the wheel name
        run: python scripts/check_release.py wheels --dir dist --platform ${{ matrix.wheel_platform }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.tag }}
          path: dist/*.whl
          if-no-files-found: error

  install:
    name: install (${{ matrix.platform.tag }}, python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-22.04, tag: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, tag: linux-arm64 }
          - { runner: macos-15-intel, tag: macos-x86_64 }
          - { runner: macos-14, tag: macos-arm64 }
          - { runner: windows-2022, tag: windows-x86_64 }
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download the wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.platform.tag }}
          path: dist

      - name: Install the wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Smoke test the installed wheel
        run: python python/tests/wheel_smoke.py

      - name: Check that the library trusts the certificates of S3
        if: matrix.python == '3.12'
        run: python scripts/https_probe.py

  guard:
    name: check the release
    needs: [wheels, install]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag and the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: python scripts/check_release.py tag --tag "$RELEASE_TAG" --prerelease "$RELEASE_PRERELEASE"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Check that the wheels are exactly the expected five
        run: python scripts/check_release.py wheels --dir dist

  publish:
    name: publish to PyPI
    needs: guard
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  verify:
    name: verify the published release
    needs: publish
    if: github.event_name == 'release'
    uses: ./.github/workflows/verify-release.yml
