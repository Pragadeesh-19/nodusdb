[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nodusdb"
version = "0.1.1"
description = "Embedded high-churn dynamic graph kernel with a GraalVM native C-ABI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE*", "NOTICE*", "licenses/*"]
keywords = ["graph", "embedded", "authorization", "access control", "write-ahead log", "lakehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/Pragadeesh-19/nodusdb"
Documentation = "https://github.com/Pragadeesh-19/nodusdb#readme"
Repository = "https://github.com/Pragadeesh-19/nodusdb"
Issues = "https://github.com/Pragadeesh-19/nodusdb/issues"
Changelog = "https://github.com/Pragadeesh-19/nodusdb/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["nodusdb*"]

[tool.setuptools.package-data]
nodusdb = ["bin/*/*"]
